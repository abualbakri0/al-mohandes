import java.security.KeyStore
import java.security.MessageDigest

apply plugin: 'com.android.application'

// Load signing configuration from keystore.properties (kept out of version control)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ============================================================
// App-integrity pin: SHA-256 of the release signing certificate is baked
// into BuildConfig.APP_SIGNER_SHA256 so MainActivity can detect APKs that
// were repackaged/re-signed with a different key and refuse to run.
// Computed automatically from keystore.properties on every build.
// If unavailable → empty string → the runtime check is skipped (fail-open)
// so CI/machines without the keystore still build.
// ============================================================
def signerSha256 = ''
if (keystorePropertiesFile.exists() && keystoreProperties['storeFile'] && keystoreProperties['storePassword'] && keystoreProperties['keyAlias']) {
    try {
        def storeFile = rootProject.file(keystoreProperties['storeFile'])
        if (storeFile.exists()) {
            def pass = keystoreProperties['storePassword'].toCharArray()
            def keyStore = null
            for (type in ['JKS', 'PKCS12']) {
                if (keyStore != null) break
                try {
                    def ks = KeyStore.getInstance(type)
                    storeFile.withInputStream { ks.load(it, pass) }
                    keyStore = ks
                } catch (Exception ignored) {
                    // try the next keystore format
                }
            }
            def cert = keyStore != null ? keyStore.getCertificate(keystoreProperties['keyAlias']) : null
            if (cert != null) {
                def digest = MessageDigest.getInstance('SHA-256').digest(cert.getEncoded())
                signerSha256 = digest.encodeHex().toString()
            }
        }
    } catch (Exception e) {
        logger.warn("APP_SIGNER_SHA256 pinning skipped: ${e.message}")
        signerSha256 = ''
    }
}

android {
    namespace = "com.almohanndes.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.almohanndes.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 31 = first build signed with the NEW keystore (rotated 2026-10-22).
        // Android refuses to update an app whose signature changed, so the
        // three current users must uninstall once before installing this build.
        versionCode 31
        versionName "1.0"
        // Integrity pin consumed by MainActivity's signature check.
        buildConfigField "String", "APP_SIGNER_SHA256", "\"${signerSha256}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        debug {
            // Debug builds are signed with this machine's debug key — never pin here.
            buildConfigField "String", "APP_SIGNER_SHA256", '""'
        }
        release {
            signingConfig signingConfigs.release
            // Integrity pin: release APK must be signed by exactly this certificate.
            buildConfigField "String", "APP_SIGNER_SHA256", "\"${signerSha256}\""
            // Enable code shrinking, obfuscation and optimization to protect the source code
            minifyEnabled true
            shrinkResources true
            // Hardening: never allow a debuggable/join-release build to ship.
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
