name: Security

# حارس تلقائي: يمنع دفع أي مفتاح توقيع أو سرّ إلى المستودع،
# ويمنع رفع كود لا يجتاز فحص TypeScript.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # 22 على الأقل: .npmrc فيه engine-strict=true و@capacitor/cli يطلب node >=22
          node-version: 22
      - name: Scan tracked files for secrets
        run: node scripts/check-secrets.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 على الأقل: .npmrc فيه engine-strict=true و@capacitor/cli يطلب node >=22
          node-version: 22
          cache: npm
      # --ignore-scripts: هذا الفحص لا يحتاج سكربتات التثبيت (esbuild/sharp)؛
      # تشغيلها قد يُفشل التثبيت لبناء وحدات أصلية لا تلزم لفحص TypeScript.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
